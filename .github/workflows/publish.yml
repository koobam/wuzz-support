name: Publish image

# Builds the support image for the VM (linux/amd64) on GitHub's runners, so the VM
# never compiles Elixir, and pushes it to ghcr.io next to the backend images
# (compose names it ${REGISTRY}/support:<TAG>). Runs on main, or by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # ghcr.io only accepts lower-case image names.
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/wuzz/support:${{ steps.meta.outputs.short }}
            ghcr.io/${{ steps.meta.outputs.owner }}/wuzz/support:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
